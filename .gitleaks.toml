title = "fwconfigsantizer gitleaks config"

[extend]
useDefault = true

# MEC-13: commit 7458b76 (the original H3a fixture-suite commit) labelled
# case 88's synthetic PEM fixture with a bare "-----BEGIN OPENSSH PRIVATE
# KEY-----" description line. That redundant header text (not the fixture's
# actual body, which is the literal string "FAKEKEYDATA88" -- no real key
# material) is what the default `private-key` rule matched on
# test/cases.js:680. The description was relabelled in a later commit so
# the fixture no longer trips the rule at all, but gitleaks scans full PR
# history (fetch-depth: 0), so the original commit's now-superseded finding
# still needs an explicit exception. This exception is pinned to that one
# rule, that one commit, and that one path (AND semantics) -- it does not
# exempt test/cases.js from any other rule, and a real secret added to this
# file in a later commit still alerts (verified locally: a negative-control
# PEM block added to test/cases.js in a follow-up commit was flagged).
[[rules]]
id = "private-key"
[[rules.allowlists]]
description = "MEC-13 synthetic PEM-header label in 7458b76 (case 88), relabelled in a later commit"
condition = "AND"
commits = ["7458b76ec9da82cdd4d13298a71376d2b8d19b52"]
paths = ['''^test/cases\.js$''']
